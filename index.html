<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>SanctaMMO — Primary Skill Trees</title>
    <link rel="stylesheet" href="styles.css?v=icons-1" />
  </head>
  <body data-class="fighter">
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">S</span>
          <div>
            <small>SANCTAMMO</small>
            <h1>Primary Skill Trees</h1>
          </div>
        </div>
        <nav
          class="class-tabs"
          id="classTabs"
          aria-label="Primary classes"
        ></nav>
      </header>

      <section class="build-panel framed-panel" aria-label="Build status">
        <div>
          <strong id="currentClass">Fighter</strong><span id="role"></span>
        </div>
        <div class="sp-total">
          <b><span id="spent">0</span>/13</b><small>Skill Points</small>
        </div>
        <div class="progress-wrap">
          <div class="progress-rail">
            <div class="progress-fill" id="progressFill"></div>
            <div id="milestones"></div>
          </div>
          <span id="remaining">13 SP remaining</span>
        </div>
        <div class="reset-row">
          <button id="resetClass" type="button">Reset Skill Tree</button>
        </div>
      </section>

      <main class="workspace">
        <section class="tree-region" aria-label="Primary Skill Tree">
          <section
            class="core-section framed-panel"
            aria-labelledby="coreTitle"
          >
            <header>
              <div>
                <small>ALWAYS AVAILABLE</small>
                <h2 id="coreTitle">Granted Core</h2>
              </div>
              <span>0 SP</span>
            </header>
            <div class="core-strip" id="grantedGrid"></div>
          </section>
          <div class="tree-toolbar">
            <span><i></i>Prerequisite</span
            ><span><i class="choice-key"></i>Choose one</span
            ><small
              >Each skill family keeps the same column through every tier</small
            >
          </div>
          <div class="keyword-legend" aria-label="Combat keyword categories">
            <button type="button" class="keyword buff-term" data-keyword="Buff">
              Buff
            </button>
            <button type="button" class="keyword hot-term" data-keyword="HoT">
              HoT
            </button>
            <button
              type="button"
              class="keyword shield-term"
              data-keyword="Shield"
            >
              Shield
            </button>
            <button type="button" class="keyword dot-term" data-keyword="DoT">
              DoT
            </button>
            <button
              type="button"
              class="keyword debuff-term"
              data-keyword="Debuff"
            >
              Debuff
            </button>
            <button type="button" class="keyword cc-term" data-keyword="CC">
              CC
            </button>
          </div>
          <div class="tree-shell framed-panel"><div id="tree"></div></div>
          <div class="notice" id="notice" aria-live="polite"></div>
          <div id="appendixHolder"></div>
        </section>

        <aside class="inspector" id="inspector" aria-label="Skill Detail">
          <button
            class="inspector-close"
            id="inspectorClose"
            type="button"
            aria-label="Close Skill Detail"
          >
            ×
          </button>
          <div id="inspectorContent" class="inspector-content"></div>
        </aside>
      </main>

      <footer>
        <span>Basic Attack is a Universal Action.</span
        ><span>13 Primary Skill Points available by level 15.</span>
      </footer>
    </div>

    <dialog
      id="confirmDialog"
      class="confirm-dialog"
      aria-labelledby="confirmTitle"
    >
      <div>
        <h2 id="confirmTitle"></h2>
        <p id="confirmMessage"></p>
        <div class="confirm-actions">
          <button id="confirmCancel" type="button">Cancel</button
          ><button id="confirmAccept" class="danger" type="button"></button>
        </div>
      </div>
    </dialog>

    <script src="data/fighter.js?v=mystic-rebalance-1"></script>
    <script src="data/scout.js?v=mystic-rebalance-1"></script>
    <script src="data/mage.js?v=mystic-rebalance-1"></script>
    <script src="data/mystic.js?v=mystic-rebalance-1"></script>
    <script src="debuff-tooltips.js?v=mystic-rebalance-1"></script>
    <script src="description-format.js?v=mystic-rebalance-1"></script>
    <script src="icon-sprite-1.js?v=icons-1"></script>
    <script src="icon-sprite-2.js?v=icons-1"></script>
    <script src="icon-sprite-3.js?v=icons-1"></script>
    <script src="icon-sprite-4.js?v=icons-1"></script>
    <script src="app.js?v=icons-1"></script>
  </body>
</html>
