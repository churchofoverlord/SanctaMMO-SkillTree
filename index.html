<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#03050a" />
    <title>SanctaMMO — Primary Skill Trees</title>
    <link rel="icon" type="image/webp" href="assets/class-fighter.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="styles.css?v=hud-7" />
  </head>
  <body data-class="fighter">
    <div class="app-shell">
      <header class="topbar">
        <h1 class="visually-hidden">SanctaMMO Primary Skill Trees</h1>
        <div class="header-emblem" id="brandClassMark" aria-hidden="true"></div>
        <div class="header-tabs">
          <nav
            class="class-tabs"
            id="classTabs"
            aria-label="Primary classes"
          ></nav>
        </div>
        <section class="core-section" aria-labelledby="coreTitle">
          <header>
            <small>Always available</small>
            <h2 id="coreTitle">Granted Core</h2>
          </header>
          <div class="core-strip" id="grantedGrid"></div>
        </section>
      </header>

      <main class="workspace">
        <section class="tree-region" aria-label="Primary Skill Tree">
        <section
          class="universal-section framed-panel"
          id="universalActionSection"
          hidden
          aria-labelledby="universalActionTitle"
        >
          <header>
            <h2 id="universalActionTitle">Universal Actions</h2>
            <span>Not Skill Tree investments</span>
          </header>
          <div class="core-strip" id="universalActionGrid"></div>
        </section>
          <div class="tree-shell framed-panel"><div id="tree"></div></div>
          <section class="build-bar framed-panel" aria-label="Build status">
            <div class="progress-wrap">
              <div class="progress-rail">
                <div class="progress-fill" id="progressFill"></div>
                <div id="milestones"></div>
              </div>
              <span id="remaining">13 SP remaining</span>
            </div>
            <div class="sp-total">
              <b><span id="spent">0</span>/13</b><small>Skill Points</small>
            </div>
            <div class="reset-row">
              <button id="resetClass" type="button">Reset Skill Tree</button>
            </div>
          </section>
          <div class="notice" id="notice" aria-live="polite"></div>
          <div id="appendixHolder"></div>
        </section>

      </main>

    </div>

    <div
      id="skillTooltip"
      class="skill-tooltip framed-panel"
      role="tooltip"
      aria-hidden="true"
    ></div>

    <dialog
      id="confirmDialog"
      class="confirm-dialog"
      aria-labelledby="confirmTitle"
    >
      <div>
        <h2 id="confirmTitle"></h2>
        <p id="confirmMessage"></p>
        <div class="confirm-actions">
          <button id="confirmCancel" type="button">Cancel</button
          ><button id="confirmAccept" class="danger" type="button"></button>
        </div>
      </div>
    </dialog>

    <script>
      window.SKILL_TREE_DATA = window.SKILL_TREE_DATA || {};
    </script>

    <script src="data/icons.js?v=hud-7"></script>
    <script src="data/fighter.js?v=hud-7"></script>
    <script src="data/scout.js?v=hud-7"></script>
    <script src="data/mage.js?v=hud-7"></script>
    <script src="data/mystic.js?v=hud-7"></script>
    <script src="debuff-tooltips.js?v=hud-7"></script>
    <script src="description-format.js?v=hud-7"></script>
    <script src="app.js?v=hud-7"></script>
  </body>
</html>
