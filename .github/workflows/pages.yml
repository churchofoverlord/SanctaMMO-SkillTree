name: Deploy SanctaMMO Skill Tree

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript and progression data
        run: |
          node --check app.js
          for file in data/*.js; do node --check "$file"; done
          node --check qa.mjs
          node qa.mjs

      - name: Smoke-render all Primary trees
        run: |
          python3 -m http.server 4173 >/tmp/sanctammo-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          for CLASS in Fighter Scout Mage Mystic; do
            URL="http://127.0.0.1:4173/?class=$CLASS"
            DOM="/tmp/rendered-$CLASS.html"
            PNG="/tmp/skill-tree-$CLASS.png"
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2200 --window-size=1440,1100 --dump-dom "$URL" >"$DOM"
            NODE_COUNT="$(grep -o 'class=\"skill-node' "$DOM" | wc -l)"
            test "$NODE_COUNT" -eq 20
            grep -q ">$CLASS<" "$DOM"
            grep -q 'Primary Skill Trees' "$DOM"
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2200 --window-size=1440,1100 --screenshot="$PNG" "$URL"
          done
          grep -q 'Severing Strike' /tmp/rendered-Fighter.html
          grep -q 'Arcane Weaving' /tmp/rendered-Mage.html
          grep -q 'Elemental Weaver' /tmp/rendered-Mage.html
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2200 --window-size=390,844 --screenshot=/tmp/skill-tree-mobile.png http://127.0.0.1:4173/?class=Fighter

      - name: Upload UI QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: skill-tree-ui-qa
          path: |
            /tmp/skill-tree-Fighter.png
            /tmp/skill-tree-Scout.png
            /tmp/skill-tree-Mage.png
            /tmp/skill-tree-Mystic.png
            /tmp/skill-tree-mobile.png
          retention-days: 7

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
