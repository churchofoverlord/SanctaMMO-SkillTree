name: Deploy SanctaMMO Skill Tree

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript and progression data
        run: |
          node --check app.js
          for file in data/*.js; do node --check "$file"; done
          node --check qa.mjs
          node qa.mjs

      - name: Smoke-render the interface
        run: |
          python3 -m http.server 4173 >/tmp/sanctammo-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2200 --window-size=1440,1100 --dump-dom http://127.0.0.1:4173/ >/tmp/rendered.html
          NODE_COUNT="$(grep -o 'class=\"skill-node' /tmp/rendered.html | wc -l)"
          test "$NODE_COUNT" -eq 20
          grep -q 'Severing Strike' /tmp/rendered.html
          grep -q 'Primary Skill Trees' /tmp/rendered.html
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2200 --window-size=1440,1100 --screenshot=/tmp/skill-tree-desktop.png http://127.0.0.1:4173/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2200 --window-size=390,844 --screenshot=/tmp/skill-tree-mobile.png http://127.0.0.1:4173/

      - name: Upload UI QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: skill-tree-ui-qa
          path: |
            /tmp/skill-tree-desktop.png
            /tmp/skill-tree-mobile.png
          retention-days: 7

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
